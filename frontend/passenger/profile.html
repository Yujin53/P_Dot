<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Profile — P_Dot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo-container">
          <div class="logo-mark">P.</div>
          <div class="logo-text">P_Dot</div>
        </a>
      </div>
      <div class="user-snippet">
        <img src="/uploads/profiles/default-avatar.png" alt="Avatar" class="user-avatar user-avatar-display">
        <div class="user-info">
          <div class="user-name user-name-display">User</div>
          <div class="user-role user-role-display">Passenger</div>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/passenger/dashboard.html"><span>🏠</span> Dashboard</a></li>
        <li><a href="/passenger/request-ride.html"><span>📍</span> Request a Ride</a></li>
        <li><a href="/passenger/active-ride.html"><span>⚡</span> Active Ride</a></li>
        <li><a href="/passenger/ride-history.html"><span>📜</span> Ride History</a></li>
        <li><a href="/passenger/saved-places.html"><span>⭐</span> Saved Places</a></li>
        <li><a href="/passenger/ratings.html"><span>★</span> Reviews & Ratings</a></li>
        <li><a href="/passenger/profile.html" class="active"><span>👤</span> Profile Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <a href="#" class="btn btn-outline btn-sm logout-btn" style="width: 100%; color: #94A3B8; border-color: #334155;">Log Out</a>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="topbar-title">Profile & Security</h1>
      </header>

      <div class="dashboard-content" style="max-width: 750px;">
        <div id="alertBox" class="alert" style="display: none;"></div>

        <!-- Personal Details -->
        <div class="card">
          <h2 style="font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary);">Personal Information</h2>
          <form id="profileForm">
            <div class="form-row">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" id="profFirst" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="profLast" class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label>Philippine Mobile Number</label>
              <input type="tel" id="profPhone" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
          </form>
        </div>

        <!-- Password Change -->
        <div class="card">
          <h2 style="font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary);">Security & Password</h2>
          <form id="passForm">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" id="currPass" class="form-control" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" class="form-control" required minlength="6">
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" class="form-control" required minlength="6">
              </div>
            </div>
            <button type="submit" class="btn btn-secondary btn-sm">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav-bar">
    <a href="/passenger/dashboard.html" class="mobile-nav-item"><span class="icon">🏠</span>Home</a>
    <a href="/passenger/request-ride.html" class="mobile-nav-item"><span class="icon">📍</span>Book</a>
    <a href="/passenger/active-ride.html" class="mobile-nav-item"><span class="icon">⚡</span>Active</a>
    <a href="/passenger/ride-history.html" class="mobile-nav-item"><span class="icon">📜</span>History</a>
    <a href="/passenger/profile.html" class="mobile-nav-item active"><span class="icon">👤</span>Profile</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script>
    Auth.checkAuth(['passenger']);
    Nav.renderHeader('My Profile');

    async function loadProfile() {
      try {
        const res = await API.get('/users/profile');
        if (res.success) {
          document.getElementById('profFirst').value = res.data.firstName;
          document.getElementById('profLast').value = res.data.lastName;
          document.getElementById('profPhone').value = res.data.phone;
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      try {
        const res = await API.put('/users/profile', {
          firstName: document.getElementById('profFirst').value.trim(),
          lastName: document.getElementById('profLast').value.trim(),
          phone: document.getElementById('profPhone').value.trim()
        });

        if (res.success) {
          API.setUser(res.data);
          Auth.setupUserBadge();
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Profile updated successfully!';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Update failed';
        alertBox.style.display = 'block';
      }
    });

    document.getElementById('passForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const p1 = document.getElementById('newPass').value;
      const p2 = document.getElementById('confirmPass').value;

      if (p1 !== p2) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'New passwords do not match';
        alertBox.style.display = 'block';
        return;
      }

      try {
        const res = await API.put('/auth/change-password', {
          currentPassword: document.getElementById('currPass').value,
          newPassword: p1,
          confirmNewPassword: p2
        });

        if (res.success) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Password changed successfully!';
          alertBox.style.display = 'block';
          e.target.reset();
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Password update failed';
        alertBox.style.display = 'block';
      }
    });

    loadProfile();
  </script>
</body>
</html>
