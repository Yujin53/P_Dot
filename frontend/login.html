<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — P_Dot Tuguegarao</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="logo-container">
      <div class="logo-mark">P.</div>
      <div class="logo-text">P_Dot</div>
      <span class="logo-tag">Tuguegarao</span>
    </a>
    <div>
      <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your P_Dot passenger, driver, or admin account</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" class="form-control" required>
            <option value="passenger">Passenger</option>
            <option value="driver">Driver</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label for="loginId">Email or Username</label>
          <input type="text" id="loginId" class="form-control" placeholder="e.g. juandc or user@demo.pdot" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Log In</button>
      </form>

      <div class="auth-footer">
        <div>Need a passenger account? <a href="/register.html">Sign up</a></div>
        <div style="margin-top: 0.5rem;">Want to drive with us? <a href="/driver-register.html">Register as Driver</a></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      const a = document.getElementById('alertBox');
      a.className = 'alert alert-warning';
      a.textContent = 'Your session has expired. Please log in again.';
      a.style.display = 'block';
    } else if (urlParams.get('registered')) {
      const a = document.getElementById('alertBox');
      a.className = 'alert alert-success';
      a.textContent = 'Account created successfully! You can now log in.';
      a.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const role = document.getElementById('role').value;
      const loginId = document.getElementById('loginId').value;
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/auth/login', { role, loginId, password });

        if (res.success) {
          API.setToken(res.data.token);
          API.setUser(res.data.user);

          // Role-based redirect
          const userRole = res.data.user.role || role;
          if (userRole === 'admin' || userRole === 'superadmin') {
            window.location.href = '/admin/dashboard.html';
          } else if (userRole === 'driver') {
            window.location.href = '/driver/dashboard.html';
          } else {
            window.location.href = '/passenger/dashboard.html';
          }
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
